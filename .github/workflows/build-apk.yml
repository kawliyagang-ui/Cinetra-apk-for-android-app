name: Build and Upload Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Detect Android Project Structure and Gradle Wrapper
        id: detect_project
        run: |
          set -e
          echo "Scanning for Android project directory..."
          PROJECT_ROOT=""
          CANDIDATES=(". " "android" "android-app")

          for dir in "." "android" "android-app"; do
            if [ -f "$dir/settings.gradle" ] || [ -f "$dir/settings.gradle.kts" ] || [ -f "$dir/build.gradle" ] || [ -f "$dir/build.gradle.kts" ]; then
              if [ -f "$dir/gradlew" ]; then
                PROJECT_ROOT="$dir"
                break
              fi
            fi
          done

          # If not found in standard candidate directories, search up to 2 subfolder levels deep
          if [ -z "$PROJECT_ROOT" ]; then
            for f in $(find . -maxdepth 3 -name "gradlew" | sort); do
              d=$(dirname "$f")
              if [ -f "$d/settings.gradle" ] || [ -f "$d/settings.gradle.kts" ] || [ -f "$d/build.gradle" ] || [ -f "$d/build.gradle.kts" ]; then
                PROJECT_ROOT="$d"
                break
              fi
            done
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Android project root or Gradle wrapper (gradlew) could not be found."
            exit 1
          fi

          echo "Found Android project root: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          if [ ! -f "gradlew" ]; then
            echo "::error::Gradle wrapper 'gradlew' not found in $PROJECT_ROOT."
            exit 1
          fi

          echo "Granting Gradle wrapper execution permissions..."
          chmod +x gradlew

          # Detect application module
          APP_MODULE=""
          if [ -d "app" ] && ([ -f "app/build.gradle" ] || [ -f "app/build.gradle.kts" ]); then
            APP_MODULE="app"
          elif [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            # Extract first include if available
            DETECTED=$(grep -o -m 1 'include(":?[a-zA-Z0-9_-]\+")' settings.gradle* | head -n 1 | sed 's/include("//' | sed 's/include("://' | sed 's/")//' || true)
            if [ -n "$DETECTED" ] && [ -d "$DETECTED" ]; then
              APP_MODULE="$DETECTED"
            fi
          fi

          if [ -z "$APP_MODULE" ]; then
            # Check any subfolder with build.gradle
            for dir in */; do
              if [ -f "${dir}build.gradle" ] || [ -f "${dir}build.gradle.kts" ]; then
                mod="${dir%/}"
                if grep -q "com.android.application" "${dir}"build.gradle* 2>/dev/null; then
                  APP_MODULE="$mod"
                  break
                fi
              fi
            done
          fi

          if [ -z "$APP_MODULE" ]; then
            echo "::error::Could not detect the Android application module."
            exit 1
          fi

          echo "Detected application module: $APP_MODULE"

          # Export outputs
          REAL_ROOT=$(pwd)
          echo "project_root=$REAL_ROOT" >> "$GITHUB_OUTPUT"
          echo "rel_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "app_module=$APP_MODULE" >> "$GITHUB_OUTPUT"

      - name: Clean Stale Caches and Build Outputs
        run: |
          ROOT_DIR="${{ steps.detect_project.outputs.project_root }}"
          APP_MOD="${{ steps.detect_project.outputs.app_module }}"
          echo "Removing stale project-level Gradle and build outputs in $ROOT_DIR..."
          rm -rf "${ROOT_DIR}/.gradle"
          rm -rf "${ROOT_DIR}/${APP_MOD}/build"
          rm -rf "${ROOT_DIR}/build"

      - name: Ensure Debug Keystore Exists
        run: |
          ROOT_DIR="${{ steps.detect_project.outputs.project_root }}"
          if [ -f "${ROOT_DIR}/debug.keystore" ]; then
            echo "debug.keystore already exists in $ROOT_DIR."
          else
            echo "Generating debug keystore at ${ROOT_DIR}/debug.keystore..."
            keytool -genkey -v \
              -keystore "${ROOT_DIR}/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK with Gradle Wrapper
        run: |
          cd "${{ steps.detect_project.outputs.project_root }}"
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate and Verify Generated APK
        id: verify_apk
        run: |
          set -e
          ROOT_DIR="${{ steps.detect_project.outputs.project_root }}"
          APP_MOD="${{ steps.detect_project.outputs.app_module }}"
          SEARCH_DIR="${ROOT_DIR}/${APP_MOD}/build/outputs/apk"

          if [ ! -d "$SEARCH_DIR" ]; then
            echo "::error::Module APK outputs directory not found at $SEARCH_DIR"
            exit 1
          fi

          echo "Searching for debug APK in $SEARCH_DIR..."
          FOUND_APK=$(find "$SEARCH_DIR" -type f -name "*debug*.apk" | head -n 1)

          if [ -z "$FOUND_APK" ]; then
            echo "Fallback: Searching for any APK file in $SEARCH_DIR..."
            FOUND_APK=$(find "$SEARCH_DIR" -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$FOUND_APK" ] || [ ! -f "$FOUND_APK" ]; then
            echo "::error::No APK file generated in $SEARCH_DIR"
            exit 1
          fi

          if [ ! -s "$FOUND_APK" ]; then
            echo "::error::Generated APK file $FOUND_APK is empty (0 bytes)."
            exit 1
          fi

          case "$FOUND_APK" in
            *.apk) echo "Verified valid APK: $FOUND_APK" ;;
            *) echo "::error::File $FOUND_APK is missing .apk extension"; exit 1 ;;
          esac

          APK_SIZE=$(du -h "$FOUND_APK" | cut -f1)
          echo "Found valid APK: $FOUND_APK (Size: $APK_SIZE)"
          echo "apk_path=$FOUND_APK" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-apk
          path: ${{ steps.verify_apk.outputs.apk_path }}
          if-no-files-found: error
