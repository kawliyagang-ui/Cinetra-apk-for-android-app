name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Java major version could not be detected."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java version must be 17 or higher. Detected: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verified: Java $JAVA_MAJOR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Debug keystore ready."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: Expected APK not found at $TARGET_APK"
            echo "Searching only inside app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 3 -name "*.apk" || true
            exit 1
          fi
          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: APK at $TARGET_APK is empty!"
            exit 1
          fi
          case "$TARGET_APK" in
            *.apk) echo "Verified valid APK: $TARGET_APK" ;;
            *) echo "ERROR: File does not have .apk extension"; exit 1 ;;
          esac

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          TEMP_RELEASE_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "${TEMP_RELEASE_DIR}/app-debug.apk"
          if [ ! -f "${TEMP_RELEASE_DIR}/app-debug.apk" ]; then
            echo "ERROR: Failed to copy APK to temporary release directory."
            exit 1
          fi
          echo "asset_path=${TEMP_RELEASE_DIR}/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          RELEASE_ASSET="${{ steps.prep_asset.outputs.asset_path }}"
          if [ ! -f "$RELEASE_ASSET" ]; then
            echo "ERROR: Release asset $RELEASE_ASSET not found."
            exit 1
          fi
          if [ ! -s "$RELEASE_ASSET" ]; then
            echo "ERROR: Release asset $RELEASE_ASSET is empty."
            exit 1
          fi
          ASSET_NAME=$(basename "$RELEASE_ASSET")
          if [ "$ASSET_NAME" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename must be app-debug.apk, got: $ASSET_NAME"
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          ### Automated Debug APK Release
          - **Build Type**: Automatically generated debug APK
          - **Built by**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Commit SHA**: \`${{ github.sha }}\`
          - **Notice**: This APK is intended for testing and development. It is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$TAG_NAME" "$RELEASE_ASSET" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "GitHub Release published successfully."
            gh release view "$TAG_NAME" || true
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "APK Filename: app-debug.apk"
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "Direct Download URL: $DIRECT_URL"

            echo "## DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Direct link to download the latest debug APK:" >> "$GITHUB_STEP_SUMMARY"
            echo "[$DIRECT_URL]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The GitHub Actions artifact **app-debug-apk** remains available as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing did not complete successfully."
            if [ "${{ steps.upload-artifact.outcome }}" = "success" ] || [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK was built successfully."
              echo "The GitHub Actions backup artifact 'app-debug-apk' remains available."
            fi
            echo "Notice: Do not use the direct latest-release link until a successful release is created."
          fi
